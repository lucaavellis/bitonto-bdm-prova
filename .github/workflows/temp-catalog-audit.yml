name: Temporary catalog audit

on:
  push:
    branches:
      - temp-catalog-audit-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parsers
        run: python -m pip install --disable-pip-version-check pandas lxml beautifulsoup4 html5lib openpyxl requests

      - name: Download and inspect public catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_output
          python - <<'PY'
          from __future__ import annotations
          import io
          import json
          import re
          from collections import Counter
          from pathlib import Path

          import pandas as pd
          import requests
          from bs4 import BeautifulSoup

          URL = "https://www.centroricerchebitonto.com/biblioteca/catalogo_biblioteca.html"
          OUT = Path("audit_output")
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; CentroRicercheCatalogAudit/1.1; +https://github.com/lucaavellis/bitonto-bdm-prova)"
          }
          response = requests.get(URL, headers=headers, timeout=180)
          response.raise_for_status()
          content = response.content
          raw_text = response.text
          (OUT / "catalogo_biblioteca.html").write_bytes(content)

          soup = BeautifulSoup(content, "lxml")
          tag_counts = Counter(tag.name for tag in soup.find_all(True))
          class_counts = Counter()
          for tag in soup.find_all(True):
              for cls in tag.get("class", []):
                  class_counts[cls] += 1

          needles = [
              "INVENTARIO", "COLLOCAZIONE", "FONDO", "LIVELLO_BIBLIOGRAFICO",
              "TIPO_DOCUMENTO", "AUTORE_PRINCIPALE", "TITOLO", "PUBBLICAZIONE",
              "DESCRIZIONE_FISICA", "ISBN", "SOGGETTO1", "NOTE_GENERALI", "ISBD"
          ]
          occurrences = {}
          for needle in needles:
              starts = [m.start() for m in re.finditer(re.escape(needle), raw_text, flags=re.I)]
              snippets = []
              for pos in (starts[:3] + starts[-3:] if starts else []):
                  snippets.append(raw_text[max(0, pos - 400): min(len(raw_text), pos + 1200)])
              occurrences[needle] = {"count": len(starts), "snippets": snippets}

          scripts = []
          for i, script in enumerate(soup.find_all("script")):
              text = script.string or script.get_text("\n", strip=False) or ""
              src = script.get("src")
              info = {"index": i, "src": src, "length": len(text)}
              if text:
                  name = f"inline_script_{i:03d}.js"
                  (OUT / name).write_text(text, encoding="utf-8")
                  info["saved_as"] = name
                  info["contains_needles"] = [n for n in needles if n.casefold() in text.casefold()]
                  info["preview"] = text[:1200]
              scripts.append(info)

          diagnostics = {
              "source_url": URL,
              "status_code": response.status_code,
              "content_type": response.headers.get("content-type"),
              "downloaded_bytes": len(content),
              "encoding": response.encoding,
              "title": soup.title.get_text(" ", strip=True) if soup.title else None,
              "tag_counts": dict(tag_counts.most_common()),
              "class_counts_top_100": dict(class_counts.most_common(100)),
              "tables": len(soup.find_all("table")),
              "rows_tr": len(soup.find_all("tr")),
              "scripts": scripts,
              "occurrences": occurrences,
              "head_text": soup.get_text(" ", strip=True)[:5000],
              "tail_text": soup.get_text(" ", strip=True)[-5000:],
          }
          (OUT / "diagnostica_html.json").write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          # Try direct HTML-table extraction, but do not fail when the catalogue is JavaScript-driven.
          try:
              tables = pd.read_html(io.BytesIO(content), displayed_only=False)
          except ValueError:
              tables = []
          diagnostics["pandas_tables_found"] = len(tables)
          if tables:
              df = max(tables, key=lambda x: x.shape[0] * max(x.shape[1], 1)).copy()
              df.to_csv(OUT / "tabella_estratta.csv", index=False, encoding="utf-8-sig")
              df.to_excel(OUT / "tabella_estratta.xlsx", index=False)
              diagnostics["largest_table_shape"] = list(df.shape)
          (OUT / "diagnostica_html.json").write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "downloaded_bytes": len(content),
              "tables": diagnostics["tables"],
              "rows_tr": diagnostics["rows_tr"],
              "scripts": len(scripts),
              "pandas_tables_found": diagnostics["pandas_tables_found"],
              "top_tags": dict(tag_counts.most_common(12)),
              "top_classes": dict(class_counts.most_common(20)),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-bitonto-audit
          path: audit_output/
          if-no-files-found: error
          retention-days: 3
