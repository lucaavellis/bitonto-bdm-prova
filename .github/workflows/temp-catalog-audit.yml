name: Temporary catalog audit

on:
  push:
    branches:
      - temp-catalog-audit-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parsers
        run: python -m pip install --disable-pip-version-check pandas lxml beautifulsoup4 html5lib openpyxl requests

      - name: Download and parse public catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_output
          python - <<'PY'
          from __future__ import annotations
          import io
          import json
          import re
          from pathlib import Path

          import pandas as pd
          import requests

          URL = "https://www.centroricerchebitonto.com/biblioteca/catalogo_biblioteca.html"
          OUT = Path("audit_output")
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; CentroRicercheCatalogAudit/1.0; +https://github.com/lucaavellis/bitonto-bdm-prova)"
          }
          response = requests.get(URL, headers=headers, timeout=180)
          response.raise_for_status()
          content = response.content
          (OUT / "catalogo_biblioteca.html").write_bytes(content)

          tables = pd.read_html(io.BytesIO(content), displayed_only=False)
          if not tables:
              raise RuntimeError("No HTML table found")
          df = max(tables, key=lambda x: x.shape[0] * max(x.shape[1], 1)).copy()

          def clean_header(value: object) -> str:
              text = " ".join(str(value).split()).strip()
              text = re.sub(r"[^0-9A-Za-zÀ-ÖØ-öø-ÿ_]+", "_", text).strip("_")
              return text or "COLONNA"

          if isinstance(df.columns, pd.MultiIndex):
              df.columns = [clean_header("_".join(str(v) for v in col if str(v) != "nan")) for col in df.columns]
          else:
              df.columns = [clean_header(col) for col in df.columns]

          # Make repeated headers unique.
          counts = {}
          unique_columns = []
          for col in df.columns:
              counts[col] = counts.get(col, 0) + 1
              unique_columns.append(col if counts[col] == 1 else f"{col}_{counts[col]}")
          df.columns = unique_columns

          for col in df.columns:
              df[col] = df[col].map(lambda x: "" if pd.isna(x) else " ".join(str(x).split()).strip())

          # Remove fully empty rows and repeated table-header rows if present.
          df = df.loc[~df.apply(lambda row: all(v == "" for v in row), axis=1)].reset_index(drop=True)
          header_signature = [c.casefold() for c in df.columns]
          def is_repeated_header(row) -> bool:
              vals = [str(v).casefold() for v in row.tolist()]
              matches = sum(a == b for a, b in zip(vals, header_signature))
              return matches >= max(3, len(header_signature) // 2)
          if len(df):
              df = df.loc[~df.apply(is_repeated_header, axis=1)].reset_index(drop=True)

          df.to_csv(OUT / "catalogo_completo.csv", index=False, encoding="utf-8-sig")
          df.to_excel(OUT / "catalogo_completo.xlsx", index=False)

          n = len(df)
          target = min(240, n)
          if target:
              positions = sorted(set(round(i * (n - 1) / max(target - 1, 1)) for i in range(target)))
              sample = df.iloc[positions].copy()
              sample.insert(0, "RIGA_CATALOGO", [p + 2 for p in positions])
          else:
              sample = df.copy()
          sample.to_csv(OUT / "campione_sistematico.csv", index=False, encoding="utf-8-sig")
          sample.to_excel(OUT / "campione_sistematico.xlsx", index=False)

          missing = {}
          distinct = {}
          examples = {}
          for col in df.columns:
              empty = df[col].eq("")
              missing[col] = {
                  "empty_count": int(empty.sum()),
                  "empty_pct": round(float(empty.mean() * 100), 2) if n else 0.0,
              }
              distinct[col] = int(df.loc[~empty, col].nunique())
              examples[col] = df.loc[~empty, col].head(10).tolist()

          summary = {
              "source_url": URL,
              "downloaded_bytes": len(content),
              "tables_found": len(tables),
              "rows": n,
              "columns": len(df.columns),
              "column_names": list(df.columns),
              "missing_by_column": missing,
              "distinct_nonempty_by_column": distinct,
              "first_records": df.head(5).to_dict(orient="records"),
              "last_records": df.tail(5).to_dict(orient="records"),
              "examples_by_column": examples,
          }
          (OUT / "riepilogo_strutturale.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({k: summary[k] for k in ("downloaded_bytes", "tables_found", "rows", "columns", "column_names")}, ensure_ascii=False, indent=2))
          PY

      - name: Upload audit files
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-bitonto-audit
          path: audit_output/
          if-no-files-found: error
          retention-days: 3
